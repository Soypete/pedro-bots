replicaCount: 1

image:
  repository: 100.81.89.62:5000/redditwatch
  # IfNotPresent, not Always: Zot serves plain HTTP while containerd defaults to
  # HTTPS, so every pull fails until /etc/rancher/k3s/registries.yaml is applied
  # to the nodes. All three nodes have the image cached, so IfNotPresent lets
  # jobs schedule anywhere; Always fails everywhere. Revert once nodes are fixed.
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: "pedro-agents"
fullnameOverride: "pedro-agents"

serviceAccount:
  create: false
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and instead to request explicit ones as needed.
  # To make this part of your chart-template deployable, you can increase -memory requests and/or limits.
  # Remember to set quotes because YAML parses 128Mi as a base-60 number!
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

monitor:
  schedule: "0 14,19,0 * * *"  # 08:00, 13:00, 18:00 Mountain Time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  activeDeadlineSeconds: 3600

suggestion:
  schedule: "0 15 * * 1"  # Monday 09:00 Mountain Time
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  activeDeadlineSeconds: 3600

social:
  schedule: "0 14 * * *"  # 08:00 Mountain Time (UTC-6 MDT, change to "0 15" for UTC-7 MST)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  activeDeadlineSeconds: 3600

cfp:
  schedule: "0 16 * * 2"  # Tuesday 10:00 Mountain Time (UTC-6 MDT, change to "0 17" for UTC-7 MST)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  activeDeadlineSeconds: 3600

discord:
  webhookUrl: ""
  notifyUserId: ""
  pingThreshold: 0.8

config:
  llamaCppBaseUrl: "http://100.121.229.114:8000/v1"
  llamaCppModel: "qwen3.6-27b-mtp"
  logLevel: "INFO"
  maxPostsPerQuery: 20
  # Reddit fetch/classify tuning — defaults match what the cluster ran pre-Helm.
  redditMinUpvotes: 25
  redditWindowHours: 168
  redditMaxComments: 5
  redditMaxPostsWithComments: 10
  redditClassifyMinScore: 50
  redditClassifyWorkers: 2
  redditFetchSafetyCap: 500

# Name of the pre-existing Secret holding REDDIT_*/DISCORD_*/SUPABASE_*/POSTGRES_URL.
# Used when vault.enabled is false.
existingSecret: "redditwatch-secrets"

vault:
  # Vault/OpenBao agent injection. Off by default: the cluster's proven path is the
  # existing Secret above. Enable once the "redditwatch" OpenBao role is confirmed.
  enabled: false
  role: "redditwatch"
  redditPath: "secret/data/apps/redditwatch"
  discordPath: "secret/data/apps/discord"
  supabasePath: "secret/data/apps/supabase"