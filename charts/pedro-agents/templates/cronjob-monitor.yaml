apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reddit-watcher.fullname" . }}-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reddit-watcher.labels" . | nindent 4 }}
    app: monitor
spec:
  schedule: {{ .Values.monitor.schedule | quote }}
  concurrencyPolicy: {{ .Values.monitor.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.monitor.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.monitor.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.monitor.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "reddit-watcher.selectorLabels" . | nindent 12 }}
            app: monitor
          {{- if .Values.vault.enabled }}
          annotations:
            {{- include "reddit-watcher.vaultAnnotations" . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- include "reddit-watcher.agentArgs" (dict "agent" "monitor" "root" .) | nindent 14 }}
              envFrom:
                {{- include "reddit-watcher.envFrom" . | nindent 16 }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
