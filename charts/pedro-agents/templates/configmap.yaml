apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reddit-watcher.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reddit-watcher.labels" . | nindent 4 }}
data:
  LLAMA_CPP_BASE_URL: {{ .Values.config.llamaCppBaseUrl | quote }}
  LLAMA_CPP_MODEL: {{ .Values.config.llamaCppModel | quote }}
  MAX_POSTS_PER_SUBREDDIT: {{ .Values.config.maxPostsPerQuery | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDDIT_MIN_UPVOTES: {{ .Values.config.redditMinUpvotes | quote }}
  REDDIT_WINDOW_HOURS: {{ .Values.config.redditWindowHours | quote }}
  REDDIT_MAX_COMMENTS: {{ .Values.config.redditMaxComments | quote }}
  REDDIT_MAX_POSTS_WITH_COMMENTS: {{ .Values.config.redditMaxPostsWithComments | quote }}
  REDDIT_CLASSIFY_MIN_SCORE: {{ .Values.config.redditClassifyMinScore | quote }}
  REDDIT_CLASSIFY_WORKERS: {{ .Values.config.redditClassifyWorkers | quote }}
  REDDIT_FETCH_SAFETY_CAP: {{ .Values.config.redditFetchSafetyCap | quote }}
