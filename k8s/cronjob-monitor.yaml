apiVersion: batch/v1
kind: CronJob
metadata:
  name: redditwatch-monitor
  namespace: redditwatch
spec:
  # 08:00 Mountain Time (UTC-6 MST / UTC-7 MDT)
  schedule: "0 14 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: redditwatch
              image: 100.81.89.62:5000/redditwatch:latest
              args: ["agent", "--agent", "monitor"]
              envFrom:
                - configMapRef:
                    name: redditwatch-config
                - secretRef:
                    name: redditwatch-secrets